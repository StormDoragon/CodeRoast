# Deploys to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
# Optional repo variables (Settings → Secrets and variables → Actions → Variables):
#   SITE_URL (e.g. https://coderoast.dev), SPONSOR_URL, PRO_WAITLIST_URL
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          VITE_SPONSOR_URL: ${{ vars.SPONSOR_URL }}
          VITE_PRO_WAITLIST_URL: ${{ vars.PRO_WAITLIST_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
