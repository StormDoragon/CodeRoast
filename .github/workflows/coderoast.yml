# Dogfooding: every PR to this repo gets roasted by the action it ships.
name: CodeRoast

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  roast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          intensity: savage
