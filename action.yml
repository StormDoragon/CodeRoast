name: 'CodeRoast PR Roaster'
description: 'Roasts every pull request: savage jokes with line-numbered receipts, real fixes, and a Banana Score out of 10.'
author: 'StormDoragon'
branding:
  icon: 'zap'
  color: 'red'
inputs:
  github-token:
    description: 'Token used to read the PR and post the comment.'
    default: ${{ github.token }}
  intensity:
    description: 'gentle | savage | unhinged'
    default: 'savage'
  fail-below:
    description: 'Fail the check when the Banana Score is below this number (0 = never fail).'
    default: '0'
  max-files:
    description: 'Maximum number of changed files to roast (most-changed first).'
    default: '30'
  comment:
    description: 'Post (and keep updating) a PR comment. The roast always goes to the job summary.'
    default: 'true'
  site-url:
    description: 'CodeRoast site used for share links.'
    default: 'https://code-roast-five.vercel.app'
outputs:
  score:
    description: 'Banana Score (1-10) of the changed files.'
  verdict:
    description: 'Verdict title, e.g. "Dumpster Fire".'
runs:
  using: 'node24'
  main: 'action/dist/index.cjs'
